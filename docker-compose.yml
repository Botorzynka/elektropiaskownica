services:
  # Wersja produkcyjna (lekki, zoptymalizowany kontener Nginx)
  elektropiaskownica:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elektropiaskownica
    ports:
      - "5173:80"
    restart: unless-stopped

  # Opcjonalna wersja deweloperska (z live-reloadingiem / montowaniem kodu)
  # Uruchomienie: docker compose --profile dev up elektropiaskownica-dev
  elektropiaskownica-dev:
    image: node:22-alpine
    container_name: elektropiaskownica-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5174:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - dev
